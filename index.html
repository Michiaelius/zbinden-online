<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 3.8rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5rem;
            max-width: 700px;
            margin: 0 auto 40px;
            line-height: 1.4;
        }
        .loader {
            border: 6px solid rgba(255,255,255,0.3);
            border-top: 6px solid white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

    <div class="loader"></div>
    
    <p>Bei Fragen oder Anliegen einfach eine E-Mail schreiben:<br>
       <a href="mailto:info@zbinden.online">info@zbinden.online</a>
    </p>
