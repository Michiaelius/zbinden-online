<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pauline Zbinden – Business Analystin / Wirtschafts-Informatikerin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .pdf-container {
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
        }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-gray-50 py-12">

    <div class="max-w-6xl mx-auto px-6">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-5xl font-bold text-gray-900">Pauline Zbinden</h1>
                <p class="text-3xl text-amber-900 mt-2">Business Analystin / Wirtschafts-Informatikerin</p>
            </div>
            
            <div class="flex gap-4">
                <!-- Download Button -->
                <a href="Lebenslauf Business Analystin Wirtschaftsinformatik.pdf" 
                   download
                   class="flex items-center gap-3 bg-amber-900 hover:bg-amber-800 text-white px-8 py-4 rounded-2xl font-semibold shadow-lg">
                    <i class="fa-solid fa-download"></i>
                    <span>PDF herunterladen</span>
                </a>
            </div>
        </div>

        <!-- PDF Vorschau -->
        <div class="pdf-container">
            <iframe 
                src="Lebenslauf Business Analystin Wirtschaftsinformatik.pdf" 
                width="100%" 
                height="1150px"
                class="w-full"
                style="border: none;">
            </iframe>
        </div>

        <div class="text-center mt-8 text-sm text-gray-500">
            <p>Der Lebenslauf wird direkt aus dem GitHub-Repository geladen.<br>
            Auf dem Handy einfach zoomen oder den Download-Button nutzen.</p>
        </div>

    </div>

</body>
</html>
