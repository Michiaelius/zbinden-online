<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body {
      margin:0; padding:20px 0; background:#0a2a4a;
      display:flex; flex-direction:column; align-items:center;
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas {
      border: 25px solid #1e40af;
      border-radius: 25px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    // (Clouds und Sand unverändert - gekürzt der Übersicht halber)
    function spawnCloud() { /* ... */ }
    for (let i = 0; i < 8; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320; sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() { /* ... */ }
    createFixedSand();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const count = Math.random() < 0.7 ? 1 : 2;
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -90 - i*40 : 1410 + i*40,
          y: 95 + Math.random() * 115,
          baseY: 95 + Math.random() * 115,
          speed: 1.05 + Math.random() * 0.75,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: Date.now()
        });
      }
    }
    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() { /* ... unverändert */ 
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa'); sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, 1320, 250);

      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c'; ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25; ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      ctx.drawImage(sandCanvas, 0, 250);
    }

    function drawCloud(cloud) { /* ... unverändert */ 
      ctx.globalAlpha = cloud.opacity * cloud.life;
      const s = cloud.size;
      const x = cloud.x; const y = cloud.y;
      ctx.fillStyle = '#ffffff';
      if (cloud.type === 1) {
        ctx.beginPath(); ctx.ellipse(x, y, 115*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 82*s, y - 18*s, 72*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 40*s, y - 26*s, 52*s, 33*s, 0, 0, Math.PI*2); ctx.fill();
      } else if (cloud.type === 2) {
        ctx.beginPath(); ctx.ellipse(x, y, 160*s, 35*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 95*s, y - 14*s, 85*s, 32*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 45*s, y - 22*s, 55*s, 28*s, 0, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.ellipse(x, y, 68*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 48*s, y - 12*s, 52*s, 32*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x - 35*s, y - 10*s, 45*s, 29*s, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 7;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.roll !== 0) ctx.rotate(bird.roll);
      if (bird.direction < 0) ctx.scale(-1, 1);
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 2.8;

      // Schmale, hohe Flügel (3-4 mal höher als breit)
      ctx.beginPath();
      ctx.moveTo(12, 2);
      ctx.quadraticCurveTo(18, -26 + flap*1.4, 24, -8);   // schmal und hoch
      ctx.quadraticCurveTo(21, -4, 14, 6);
      ctx.fill();
      ctx.stroke();

      // Körper
      ctx.beginPath(); ctx.ellipse(19, 6, 13, 8.5, 0.15, 0, Math.PI*2); ctx.fill();

      // Kopf
      ctx.beginPath(); ctx.arc(29, 2, 6.8, 0, Math.PI*2); ctx.fill();

      // Schnabel
      ctx.beginPath(); ctx.moveTo(34, 1); ctx.lineTo(41, 2); ctx.lineTo(34, 4); ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      // Wolken & Vögel Update (wie in Basis B) ...

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
