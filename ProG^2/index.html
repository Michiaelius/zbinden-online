<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis</title>
  <style>
    body {
      margin:0; padding:20px 0; background:#0a2a4a;
      display:flex; flex-direction:column; align-items:center;
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas {
      border: 25px solid #1e40af;
      border-radius: 25px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];
    let waterTime = 0;

    function spawnCloud() {
      const isFar = Math.random() > 0.55;
      clouds.push({
        x: Math.random() > 0.5 ? -300 : 1650,
        y: isFar ? 45 + Math.random() * 55 : 72 + Math.random() * 65,
        size: isFar ? 0.45 + Math.random() * 0.35 : 0.75 + Math.random() * 0.55,
        speed: isFar ? 0.22 + Math.random() * 0.18 : 0.38 + Math.random() * 0.25,
        direction: Math.random() > 0.5 ? 1 : -1,
        opacity: isFar ? 0.75 : 0.95,
        pause: 0,
        life: 1.0,
        dissolving: false
      });
    }
    for (let i = 0; i < 6; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 510);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 6200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*510, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const count = Math.random() < 0.7 ? 1 : 2;
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -90 - i*40 : 1410 + i*40,
          y: 95 + Math.random() * 115,
          baseY: 95 + Math.random() * 115,
          speed: 1.05 + Math.random() * 0.75,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: Date.now()
        });
      }
    }
    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      // Sonne
      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.drawImage(sandCanvas, 0, 250);

      // === NATÜRLICHES WASSERUFER (wie deine grüne Skizze) ===
      const x = 110;
      const y = 255;

      // Braunes Ufer (unregelmäßig, abfallend)
      ctx.fillStyle = '#8d6f47';
      ctx.beginPath();
      ctx.moveTo(x - 25, y - 12);
      ctx.quadraticCurveTo(x + 45, y - 38, x + 135, y - 22);
      ctx.quadraticCurveTo(x + 215, y - 45, x + 325, y - 18);
      ctx.lineTo(x + 355, y + 115);
      ctx.lineTo(x - 30, y + 125);
      ctx.closePath();
      ctx.fill();

      // Wasser (blau, passend zur Mulde)
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 8);
      ctx.quadraticCurveTo(x + 75, y + 52, x + 155, y + 28);
      ctx.quadraticCurveTo(x + 245, y + 58, x + 325, y + 25);
      ctx.lineTo(x + 340, y + 105);
      ctx.lineTo(x + 15, y + 108);
      ctx.closePath();
      ctx.fill();

      // Wellen
      waterTime += 0.055;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 30, y + 35 + i*23);
        for (let px = 50; px < 310; px += 32) {
          ctx.quadraticCurveTo(
            x + px,
            y + 32 + i*23 + Math.sin(waterTime + px*0.04) * 7,
            x + px + 32,
            y + 35 + i*23
          );
        }
        ctx.stroke();
      }
    }

    function drawCloud(cloud) {
      ctx.globalAlpha = cloud.opacity * cloud.life;
      const s = cloud.size;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(cloud.x, cloud.y, 115*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 82*s, cloud.y - 18*s, 72*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 40*s, cloud.y - 26*s, 52*s, 33*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 7;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.roll !== 0) ctx.rotate(bird.roll);
      if (bird.direction < 0) ctx.scale(-1, 1);
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 3.2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, -19 + flap, 35, -10);
      ctx.quadraticCurveTo(26, -5, 11, 4);
      ctx.fill(); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(19, 5, 13, 8, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30, 1, 6.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(35, 0); ctx.lineTo(43, 2); ctx.lineTo(35, 4); ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        if (c.pause > 0) c.pause--;
        else c.x += c.speed * c.direction;
        if (Math.random() < 0.0035) c.pause = 90 + Math.random()*160;
        if (!c.dissolving && Math.random() < 0.0015) c.dissolving = true;
        if (c.dissolving) c.life -= 0.0065;
        if (c.x < -450 || c.x > 1750 || c.life <= 0) clouds.splice(i, 1);
      }
      if (clouds.length < 8 && Math.random() < 0.025) spawnCloud();

      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0058;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 24;
        b.flap += 0.22;

        if (Math.random() < 0.008) b.rollSpeed = (Math.random() - 0.5) * 0.25;
        b.roll += b.rollSpeed;
        if (Math.abs(b.roll) > 0.35) b.rollSpeed *= -0.7;

        if (Date.now() - b.lastTurn > 15000 && Math.random() < 0.0015) {
          b.direction *= -1;
          b.lastTurn = Date.now();
        }

        if (b.x < -180 || b.x > 1500) birds.splice(i, 1);
      }
      if (birds.length < 3 && Math.random() < 0.006) spawnBird();

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
