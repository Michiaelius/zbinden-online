<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a2a4a;
      color: white;
      overflow: hidden;
    }

    #header {
      background: linear-gradient(#1e4a7a, #0f3d6b);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #60a5fa;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #water-reservoir {
      height: 120px;
      background: linear-gradient(to bottom, #3b82f6 0%, #60a5fa 30%, transparent 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 6px solid #1e40af;
    }

    #water-reservoir::after {
      content: "🌊";
      position: absolute;
      font-size: 80px;
      opacity: 0.15;
      animation: wave 8s linear infinite;
    }

    @keyframes wave {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(50%); }
    }

    #playground {
      width: 100%;
      height: calc(100vh - 200px);
      background: 
        linear-gradient(#d2b48c, #c19a6b),
        url('https://i.imgur.com/8ZfK8vL.jpg') repeat; /* Sand-Textur */
      background-size: cover;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 80px rgba(0,0,0,0.4);
    }

    .element {
      position: absolute;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: move;
      user-select: none;
      filter: drop-shadow(3px 3px 4px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>💧 Wasser-Logik — Entdecke & Baue</h1>
    <button onclick="alert('Moduswechsel kommt später')">Zu Baustein-Modus</button>
  </div>

  <!-- Wasser oben -->
  <div id="water-reservoir"></div>

  <!-- Sand-Spielbereich -->
  <div id="playground"></div>

<script>
// Drag & Drop vorbereitet (später für Bausteine)
const playground = document.getElementById('playground');

function createElement(type, x, y) {
  const el = document.createElement('div');
  el.className = 'element';
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  switch(type) {
    case 'source': el.textContent = '🚰'; break;
    case 'pipe':   el.textContent = '🟦'; break;
    case 'and':    el.textContent = '🔗'; break;
    case 'not':    el.textContent = '⭯'; break;
    case 'sink':   el.textContent = '🪣'; break;
  }

  // Verschieben möglich
  makeDraggable(el);
  playground.appendChild(el);
}

function makeDraggable(el) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

  el.onmousedown = dragMouseDown;

  function dragMouseDown(e) {
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    el.style.top = (el.offsetTop - pos2) + "px";
    el.style.left = (el.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

// Test-Elemente zum Start (kann später entfernt werden)
window.onload = () => {
  createElement('source', 150, 200);
  createElement('sink', 600, 450);
};
</script>

</body>
</html>
