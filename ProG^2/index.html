<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a2a4a; display:flex; justify-content:center; align-items:center; height:100vh; }
    #game-container { border:12px solid #1e40af; border-radius:16px; box-shadow:0 0 50px rgba(0,0,0,0.9); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.isDigging = false;
      }

      create() {
        const w = 1100;
        const h = 680;

        // Sand
        this.add.rectangle(w/2, h/2 + 90, w, h, 0xe2c18a);

        // Sand-Textur
        for (let i = 0; i < 2000; i++) {
          this.add.circle(Math.random()*w, 210 + Math.random()*(h-260), Math.random()*3.5 + 1.5, 0xc99a5f);
        }

        // Wasserbehälter — jetzt fast ruhig
        this.water = this.add.rectangle(w/2, 145, w, 175, 0x38bdf8);
        this.water.setStrokeStyle(22, 0x1e40af);
        this.shine = this.add.rectangle(w/2, 105, w-90, 50, 0xffffff).setAlpha(0.32);

        // Sehr leichte Bewegung
        this.tweens.add({ 
          targets: this.water, 
          y: 148, 
          duration: 4000, 
          yoyo: true, 
          repeat: -1, 
          ease: 'Sine.easeInOut' 
        });

        this.add.text(w/2, 42, '💧 Wasser-Logik', { 
          fontSize: '52px', color: '#fff', fontStyle: 'bold', stroke: '#1e40af', strokeThickness: 10 
        }).setOrigin(0.5);

        this.add.text(w/2, 85, 'Level 1 — Graben & Wasser lenken', { 
          fontSize: '26px', color: '#bae6fd' 
        }).setOrigin(0.5);

        // ==================== KANAL GRABEN ====================
        this.input.on('pointerdown', (p) => {
          if (p.y < 200) return;
          this.isDigging = true;
          this.digChannel(p.x, p.y);
        });

        this.input.on('pointermove', (p) => {
          if (this.isDigging && p.y > 200) {
            this.digChannel(p.x, p.y);
          }
        });

        this.input.on('pointerup', () => this.isDigging = false);

        this.helpText = this.add.text(w/2, h - 40, '🖱️ Maustaste halten und ziehen = Kanal graben', {
          fontSize: '24px', color: '#fef08c'
        }).setOrigin(0.5);
      }

      digChannel(x, y) {
        // Äußerer dunkler Rand
        const outer = this.add.graphics();
        outer.lineStyle(52, 0x6b5a3d, 1);
        outer.strokeCircle(x, y, 26);
        
        // Innerer Kanal (heller)
        const inner = this.add.graphics();
        inner.lineStyle(36, 0x8d6f47, 1);
        inner.strokeCircle(x, y, 26);

        // Leichter Schatten unten
        const shadow = this.add.graphics();
        shadow.fillStyle(0x5c4a35, 0.6);
        shadow.fillCircle(x + 4, y + 6, 18);
      }

      update() {
        // Kein Regen mehr
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1100,
      height: 680,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
