<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Wolken-Positionen
    let cloud1X = 250;
    let cloud2X = 820;
    
    // Vogel-Positionen
    let birds = [
      {x: -100, y: 180, speed: 1.2},
      {x: -300, y: 240, speed: 0.9}
    ];

    function drawBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 460);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 460);

      // Sonne
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(1080, 170, 82, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(1080, 170, 63, 0, Math.PI*2); ctx.fill();

      // Wolke 1
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(cloud1X, 130, 120, 48, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud1X + 90, 110, 82, 38, 0, 0, Math.PI*2); ctx.fill();

      // Wolke 2
      ctx.beginPath(); ctx.ellipse(cloud2X, 165, 110, 42, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud2X + 90, 145, 72, 35, 0, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 410, 1320, 350);

      // Sand-Textur
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 4500; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*1320, 420 + Math.random()*340, Math.random()*5 + 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawBird(x, y) {
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x+18, y-8);
      ctx.moveTo(x, y);
      ctx.lineTo(x+18, y+6);
      ctx.stroke();
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawBackground();

      // Wolken langsam bewegen
      cloud1X += 0.4;
      cloud2X += 0.35;
      if (cloud1X > 1500) cloud1X = -200;
      if (cloud2X > 1500) cloud2X = -200;

      // Vögel
      birds.forEach(bird => {
        bird.x += bird.speed;
        drawBird(bird.x, bird.y);
        if (bird.x > 1400) bird.x = -100;
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
