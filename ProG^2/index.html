<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { 
      margin:0; padding:0; background:#0a2a4a; 
      display:flex; justify-content:center; align-items:center; 
      height:100vh; 
    }
    #game-container { 
      border:12px solid #1e40af; 
      border-radius:16px; 
      box-shadow:0 0 50px rgba(0,0,0,0.9); 
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.holes = [];
        this.isDigging = false;
        this.lastDigPos = null;
      }

      create() {
        const w = 1100;
        const h = 680;

        // Sand
        this.add.rectangle(w/2, h/2 + 90, w, h, 0xe2c18a);

        // Sand-Textur
        for (let i = 0; i < 2000; i++) {
          const x = Math.random() * w;
          const y = 210 + Math.random() * (h - 260);
          this.add.circle(x, y, Math.random()*3.5 + 1.5, 0xc99a5f);
        }

        // Wasserbehälter (ruhiger)
        this.water = this.add.rectangle(w/2, 145, w, 175, 0x38bdf8);
        this.water.setStrokeStyle(20, 0x1e40af);

        this.shine = this.add.rectangle(w/2, 105, w-100, 55, 0xffffff).setAlpha(0.35);

        // Leichte, dezente Bewegung
        this.tweens.add({ 
          targets: this.water, 
          y: 152, 
          duration: 2800, 
          yoyo: true, 
          repeat: -1, 
          ease: 'Sine.easeInOut' 
        });

        this.add.text(w/2, 42, '💧 Wasser-Logik', { 
          fontSize: '52px', color: '#fff', fontStyle: 'bold', stroke: '#1e40af', strokeThickness: 10 
        }).setOrigin(0.5);

        this.add.text(w/2, 85, 'Level 1 — Graben & Wasser lenken', { 
          fontSize: '26px', color: '#bae6fd' 
        }).setOrigin(0.5);

        // ==================== GRAB MECHANIK ====================
        this.input.on('pointerdown', (p) => {
          if (p.y < 200) return;
          this.isDigging = true;
          this.lastDigPos = {x: p.x, y: p.y};
          this.digAt(p.x, p.y);
        });

        this.input.on('pointermove', (p) => {
          if (!this.isDigging || p.y < 200) return;
          if (this.lastDigPos) {
            this.drawDigLine(this.lastDigPos.x, this.lastDigPos.y, p.x, p.y);
          }
          this.lastDigPos = {x: p.x, y: p.y};
          this.digAt(p.x, p.y);
        });

        this.input.on('pointerup', () => {
          this.isDigging = false;
          this.lastDigPos = null;
        });

        this.helpText = this.add.text(w/2, h - 40, '🖱️ Maustaste halten und ziehen zum Graben', {
          fontSize: '24px', color: '#fef08c'
        }).setOrigin(0.5);
      }

      digAt(x, y) {
        const hole = this.add.circle(x, y, 27, 0x8d6f47);
        hole.setStrokeStyle(6, 0x6b5a3d);
        this.holes.push(hole);
      }

      drawDigLine(x1, y1, x2, y2) {
        const distance = Phaser.Math.Distance.Between(x1, y1, x2, y2);
        const steps = Math.max(2, Math.floor(distance / 16));

        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = Phaser.Math.Linear(x1, x2, t);
          const y = Phaser.Math.Linear(y1, y2, t);
          this.digAt(x, y);
        }
      }

      update() {
        if (Phaser.Math.Between(1, 5) === 1) {
          this.dropWater();
        }
      }

      dropWater() {
        const drop = this.add.circle(Phaser.Math.Between(100, 1000), 165, 13, 0x67e8f9);
        drop.setAlpha(0.9);

        this.tweens.add({
          targets: drop,
          y: 680,
          duration: 1200 + Phaser.Math.Between(300, 900),
          onComplete: () => drop.destroy()
        });
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1100,
      height: 680,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
