<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body { margin:0; padding:20px 0; background:#0a2a4a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family: Arial, sans-serif; }
    .header { width: 1320px; background: linear-gradient(#1e3a8a, #3b82f6); padding: 20px 0; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 15px; text-align: center; }
    canvas { border: 25px solid #1e40af; border-radius: 25px; box-shadow: 0 25px 90px rgba(0,0,0,0.95); }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      birds.push({
        x: dir > 0 ? -120 : 1440,
        y: 110 + Math.random() * 120,
        baseY: 110 + Math.random() * 120,
        speed: 1.3 + Math.random() * 0.7,
        currentSpeed: 1.3,
        targetSpeed: 1.3,
        direction: dir,
        flap: Math.random() * 10,
        scale: 0.45,
        wave: Math.random() * Math.PI * 2,
        roll: 0,
        isTurning: false,
        turnPhase: 0,
        hasFlipped: false,
        lastTurn: Date.now() - 5000   // sofort möglich
      });
    }

    for (let i = 0; i < 5; i++) spawnBird();

    function drawStaticBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 55;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 250, 1320, 510);
    }

    function drawBird(b) {
      const flap = Math.sin(b.flap) * 11;
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b.roll !== 0) ctx.rotate(b.roll * 0.15);
      if (b.direction < 0) ctx.scale(-1, 1);
      ctx.scale(b.scale, b.scale);

      ctx.fillStyle = '#1e2937';
      ctx.strokeStyle = '#1e2937';
      ctx.lineWidth = 2.5;

      ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(1,5); ctx.lineTo(3,13); ctx.fill();
      ctx.beginPath(); ctx.moveTo(23,13); ctx.quadraticCurveTo(11, -22 + flap*4, 11, -3); ctx.quadraticCurveTo(22,4,15,13); ctx.fill();
      ctx.beginPath(); ctx.ellipse(19,8,10,7,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(29,4,6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(34,3); ctx.lineTo(46,4); ctx.lineTo(34,6); ctx.fill();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();

      birds.forEach(b => drawBird(b));

      birds.forEach(b => {
        // Geschwindigkeit glätten
        b.currentSpeed += (b.targetSpeed - b.currentSpeed) * 0.045;

        b.wave += 0.0018;
        b.x += b.currentSpeed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 14;
        b.flap += 0.06;

        // Leichtes Rollen
        if (Math.random() < 0.002) b.rollSpeed = (Math.random() - 0.5) * 0.12;
        b.roll += b.rollSpeed * 0.8;
        if (Math.abs(b.roll) > 0.18) b.rollSpeed *= -0.65;

        // === RICHTUNGSWECHSEL LOGIK ===
        if (!b.isTurning && Date.now() - b.lastTurn > 2200 && Math.random() < 0.012) {
          b.isTurning = true;
          b.turnPhase = 0;
          b.hasFlipped = false;
          b.targetSpeed = b.speed * 0.18;
        }

        if (b.isTurning) {
          b.turnPhase++;

          if (b.turnPhase < 45) {
            b.targetSpeed = b.speed * 0.18;
          } 
          else if (b.turnPhase < 95) {
            b.targetSpeed = 0.04;           // Pause
          } 
          else if (!b.hasFlipped) {
            b.direction *= -1;              // ←←← RICHTUNG ÄNDERN
            b.hasFlipped = true;
            b.targetSpeed = b.speed * 0.65;
          } 
          else if (b.turnPhase > 155) {
            b.targetSpeed = b.speed;
            b.isTurning = false;
            b.lastTurn = Date.now();
          }
        }
      });

      // Aufräumen + Nachschub
      for (let i = birds.length - 1; i >= 0; i--) {
        if (birds[i].x < -250 || birds[i].x > 1550) {
          birds.splice(i, 1);
        }
      }

      if (birds.length < 6 && Math.random() < 0.025) spawnBird();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
