<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body {
      margin:0; padding:20px 0; background:#0a2a4a;
      display:flex; flex-direction:column; align-items:center;
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas {
      border: 25px solid #1e40af;
      border-radius: 25px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    function spawnCloud() { /* ... gleicher Code wie vorher ... */ }
    for (let i = 0; i < 8; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320; sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() { /* ... gleicher Code ... */ }
    createFixedSand();

    function spawnBird() { /* ... gleicher Code ... */ }
    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() { /* ... gleicher Code ... */ }

    function drawCloud(cloud) { /* ... gleicher Code ... */ }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 10;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      
      // Nur minimale Rotation erlauben (fast keine Neigung)
      const rotation = bird.roll * 0.3;   // stark gedämpft
      if (rotation !== 0) ctx.rotate(rotation);
      
      if (bird.direction < 0) ctx.scale(-1, 1);
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 2.6;

      // Schwanz
      ctx.beginPath();
      ctx.moveTo(8, 8);
      ctx.lineTo(1, 6);
      ctx.lineTo(2, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Flügel
      ctx.beginPath();
      ctx.moveTo(23, 13);
      ctx.quadraticCurveTo(12, -22 + flap*4, 12, -2);
      ctx.quadraticCurveTo(21, 3, 14, 13);
      ctx.fill();
      ctx.stroke();

      // Körper
      ctx.beginPath(); 
      ctx.ellipse(19.5, 8, 10, 7, 0.05, 0, Math.PI*2); 
      ctx.fill();

      // Kopf
      ctx.beginPath(); 
      ctx.arc(29, 4, 6, 0, Math.PI*2); 
      ctx.fill();

      // Schnabel
      ctx.beginPath(); 
      ctx.moveTo(34, 3); 
      ctx.lineTo(45, 4); 
      ctx.lineTo(34, 5.5); 
      ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        if (c.pause > 0) c.pause--;
        else c.x += c.speed * c.direction;
        if (Math.random() < 0.0018) c.pause = 140 + Math.random()*180;
        if (c.dissolving) c.life -= 0.006;
        else if (Math.random() < 0.0004) c.dissolving = true;
        if (c.x < -550 || c.x > 1880 || c.life <= 0) clouds.splice(i, 1);
      }
      if (clouds.length < 12 && Math.random() < 0.038) spawnCloud();

      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0028;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 22;
        b.flap += 0.14;

        // Sehr seltene und sanfte Rotation
        if (Math.random() < 0.003) {
          b.rollSpeed = (Math.random() - 0.5) * 0.15;
        }
        b.roll += b.rollSpeed;
        if (Math.abs(b.roll) > 0.2) b.rollSpeed *= -0.6;

        // Richtung ändern bleibt erlaubt
        if (Date.now() - b.lastTurn > 14000 && Math.random() < 0.0018) {
          b.direction *= -1;
          b.lastTurn = Date.now();
        }

        if (b.x < -180 || b.x > 1500) birds.splice(i, 1);
      }
      if (birds.length < 3 && Math.random() < 0.006) spawnBird();

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
