<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; height:100vh; 
      font-family: Arial, sans-serif;
    }
    .header {
      width: 1280px;
      text-align: center;
      padding: 15px 0 10px 0;
      background: linear-gradient(#1e40af, #3b82f6);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: -10px;
      z-index: 10;
    }
    canvas { 
      border: 22px solid #1e40af; 
      border-top: none;
      border-radius: 0 0 32px 32px; 
      box-shadow: 0 20px 80px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:52px;">💧 Wasser-Logik</h1>
    <p style="margin:5px 0 0 0; color:#bae6fd; font-size:26px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1280" height="780"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function drawBackground() {
      // Himmel (groß)
      const sky = ctx.createLinearGradient(0, 0, 0, 450);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1280, 450);

      // Sonne
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(1050, 170, 78, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(1050, 170, 60, 0, Math.PI*2); ctx.fill();

      // Wolken
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(220, 120, 115, 45, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(310, 100, 80, 38, 0, 0, Math.PI*2); ctx.fill();
      
      ctx.beginPath(); ctx.ellipse(780, 155, 105, 40, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(860, 135, 70, 35, 0, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 390, 1280, 390);

      // Sand-Textur
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 4200; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*1280, 400 + Math.random()*380, Math.random()*4.8 + 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    drawBackground();
  </script>
</body>
</html>
