<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a2a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    #game {
      border: 16px solid #1e40af;
      border-radius: 24px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      background: #fff;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 1100;
    canvas.height = 680;
    document.getElementById('game').appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let isDigging = false;
    let lastX = 0, lastY = 0;

    // Himmel
    function drawBackground() {
      // Himmel
      const grad = ctx.createLinearGradient(0, 0, 0, 280);
      grad.addColorStop(0, '#7dd3fc');
      grad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1100, 280);

      // Sonne
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(920, 130, 58, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath();
      ctx.arc(920, 130, 46, 0, Math.PI * 2);
      ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 220, 1100, 460);

      // Sand Textur
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 2800; i++) {
        const x = Math.random() * 1100;
        const y = 230 + Math.random() * 440;
        const r = Math.random() * 4 + 1.5;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawBackground();

    // Wasserbehälter
    function drawWater() {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 80, 1100, 160);
      ctx.strokeStyle = '#1e40af';
      ctx.lineWidth = 28;
      ctx.strokeRect(0, 80, 1100, 160);

      // Glanz
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(80, 95, 940, 55);
    }

    drawWater();

    // Titel
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 54px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💧 Wasser-Logik', 550, 55);
    ctx.font = '26px Arial';
    ctx.fillStyle = '#bae6fd';
    ctx.fillText('Level 1 — Graben & Wasser lenken', 550, 92);

    // Hilfetext
    ctx.font = '24px Arial';
    ctx.fillStyle = '#fef08c';
    ctx.fillText('🖱️ Maustaste halten und ziehen = Kanal graben', 550, 640);

    // Graben
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < 220) return;
      
      isDigging = true;
      lastX = x;
      lastY = y;
      drawDig(x, y);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDigging) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < 220) return;

      drawDigLine(lastX, lastY, x, y);
      lastX = x;
      lastY = y;
    });

    canvas.addEventListener('mouseup', () => isDigging = false);
    canvas.addEventListener('mouseleave', () => isDigging = false);

    function drawDig(x, y) {
      // Dunkler Rand
      ctx.fillStyle = '#6b5a3d';
      ctx.beginPath();
      ctx.arc(x, y, 29, 0, Math.PI * 2);
      ctx.fill();
      // Innerer Kanal
      ctx.fillStyle = '#8d6f47';
      ctx.beginPath();
      ctx.arc(x, y, 21, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawDigLine(x1, y1, x2, y2) {
      ctx.strokeStyle = '#6b5a3d';
      ctx.lineWidth = 54;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.strokeStyle = '#8d6f47';
      ctx.lineWidth = 38;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  </script>
</body>
</html>
