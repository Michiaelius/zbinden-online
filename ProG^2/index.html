<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik — Entdecke & Baue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a2a4a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: linear-gradient(#1e4a7a, #0f3d6b);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 5px solid #60a5fa;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #header h1 {
      font-size: 1.8rem;
    }

    #water-reservoir {
      height: 130px;
      background: linear-gradient(to bottom, #3b82f6, #60a5fa, rgba(59,130,246,0.3));
      position: relative;
      overflow: hidden;
      border-bottom: 8px solid #1e40af;
    }

    #water-reservoir::before {
      content: "🌊 🌊 🌊 🌊 🌊";
      position: absolute;
      font-size: 70px;
      opacity: 0.25;
      animation: wave 12s linear infinite;
      white-space: nowrap;
      top: 25px;
    }

    @keyframes wave {
      0% { transform: translateX(-30%); }
      100% { transform: translateX(30%); }
    }

    #playground {
      flex: 1;
      background: linear-gradient(#d4b38a, #b38a5e);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
    }

    .element {
      position: absolute;
      width: 75px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      cursor: move;
      filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>💧 Wasser-Logik — Entdecke & Baue</h1>
    <button id="mode-switch">Zu Baustein-Modus</button>
  </div>

  <div id="water-reservoir"></div>
  <div id="playground"></div>

  <script>
    const playground = document.getElementById('playground');

    function makeDraggable(el) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      el.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    function createElement(type, x, y) {
      const el = document.createElement('div');
      el.className = 'element';
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const symbols = { source: '🚰', pipe: '🟦', and: '🔗', not: '⭯', sink: '🪣' };
      el.textContent = symbols[type] || '❓';
      
      makeDraggable(el);
      playground.appendChild(el);
    }

    window.onload = () => {
      console.log("✅ Wasser-Logik bereit – Spielfeld leer");
    };
  </script>
</body>
</html>
