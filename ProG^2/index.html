<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let cloud1X = 250;
    let cloud2X = 820;
    
    let birds = [
      {x: -120, y: 155, speed: 1.55},
      {x: -450, y: 225, speed: 1.05}
    ];

    // Statischen Hintergrund EINMAL zeichnen
    function drawStaticBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 460);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 460);

      // Sonne
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(1080, 170, 82, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(1080, 170, 63, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 410, 1320, 350);

      // Sand-Textur (nur einmal!)
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 4800; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*1320, 420 + Math.random()*340, Math.random()*5 + 1.6, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawMovingElements() {
      // Wolken
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(cloud1X, 130, 125, 48, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud1X + 95, 112, 85, 39, 0, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.ellipse(cloud2X, 168, 115, 44, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud2X + 88, 148, 76, 36, 0, 0, Math.PI*2); ctx.fill();

      // Bessere Vögel
      ctx.strokeStyle = '#1e2937';
      ctx.lineWidth = 4.5;
      birds.forEach(bird => {
        ctx.beginPath();
        ctx.moveTo(bird.x, bird.y);
        ctx.lineTo(bird.x + 26, bird.y - 13);
        ctx.moveTo(bird.x + 4, bird.y);
        ctx.lineTo(bird.x + 28, bird.y + 11);
        ctx.stroke();
      });
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 460);   // Nur Himmel löschen!

      drawStaticBackground();   // Sand bleibt stabil
      drawMovingElements();

      // Wolken bewegen
      cloud1X += 0.45;
      cloud2X += 0.38;
      if (cloud1X > 1600) cloud1X = -300;
      if (cloud2X > 1600) cloud2X = -250;

      // Vögel bewegen
      birds.forEach(bird => {
        bird.x += bird.speed;
        if (bird.x > 1500) bird.x = -250;
      });

      requestAnimationFrame(animate);
    }

    // Start
    drawStaticBackground();
    animate();
  </script>
</body>
</html>
