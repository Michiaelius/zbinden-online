<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];
    let waterTime = 0;

    // ... (Cloud und Bird spawn Funktionen bleiben gleich - gekürzt der Übersicht halber)

    function spawnCloud() {
      const isFar = Math.random() > 0.6;
      clouds.push({
        x: Math.random() > 0.5 ? -280 : 1600,
        y: isFar ? 55 + Math.random() * 50 : 78 + Math.random() * 55,
        size: isFar ? 0.38 + Math.random() * 0.32 : 0.52 + Math.random() * 0.38,
        speed: isFar ? 0.028 + Math.random() * 0.035 : 0.042 + Math.random() * 0.045,
        direction: Math.random() > 0.5 ? 1 : -1,
        opacity: isFar ? 0.7 : 0.92,
        pause: 0,
        life: 1.0,
        dissolving: false
      });
    }

    for (let i = 0; i < 3; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 510);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 6200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*510, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() { /* ... gleiche Funktion wie vorher ... */ 
      const dir = Math.random() > 0.5 ? 1 : -1;
      const count = Math.random() < 0.7 ? 1 : 2;
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -90 - i*40 : 1410 + i*40,
          y: 95 + Math.random() * 115,
          baseY: 95 + Math.random() * 115,
          speed: 1.05 + Math.random() * 0.75,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: Date.now()
        });
      }
    }

    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      // Sonne
      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.drawImage(sandCanvas, 0, 250);

      // === SEE ===
      const lakeX = 880;
      const lakeY = 520;
      const lakeW = 380;
      const lakeH = 210;

      // See-Füllung
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.ellipse(lakeX + lakeW/2, lakeY + lakeH/2 - 10, lakeW/2, lakeH/2, 0, 0, Math.PI*2);
      ctx.fill();

      // Wellen auf dem See
      waterTime += 0.04;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 6;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(lakeX + 30, lakeY + 50 + i*28);
        for (let x = 40; x < lakeW - 30; x += 25) {
          ctx.quadraticCurveTo(
            lakeX + x, 
            lakeY + 45 + i*28 + Math.sin(waterTime + x/40) * 9,
            lakeX + x + 25, 
            lakeY + 50 + i*28
          );
        }
        ctx.stroke();
      }

      // See-Rand (dunkler)
      ctx.strokeStyle = '#0369a1';
      ctx.lineWidth = 18;
      ctx.beginPath();
      ctx.ellipse(lakeX + lakeW/2, lakeY + lakeH/2 - 10, lakeW/2 + 8, lakeH/2 + 6, 0, 0, Math.PI*2);
      ctx.stroke();
    }

    function drawCloud(cloud) { /* ... unverändert ... */ }
    function drawBird(bird) { /* ... unverändert ... */ }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      // Wolken & Vögel Update (wie vorher)

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
