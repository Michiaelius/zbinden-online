<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis</title>
  <style>
    body { margin:0; padding:20px 0; background:#0a2a4a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family: Arial, sans-serif; }
    .header {
      width: 1320px; background: linear-gradient(#1e3a8a, #3b82f6); padding: 15px 30px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 15px; display: flex; justify-content: space-between; align-items:center;
    }
    canvas { border: 25px solid #1e40af; border-radius: 25px; box-shadow: 0 25px 90px rgba(0,0,0,0.95); }
    .refresh-btn {
      background: #ef4444; color: white; border: none; padding: 10px 18px; font-size: 16px; font-weight: bold;
      border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <button onclick="forceHardRefresh()" class="refresh-btn">🔄 Hard Refresh</button>
    <div style="text-align:center; flex:1;">
      <h1 style="margin:0; color:white; font-size:52px;">💧 Wasser-Logik</h1>
      <p style="margin:6px 0 0 0; color:#bae6fd; font-size:24px;">Level 1 — Graben & Wasser lenken</p>
    </div>
    <div style="width:140px;"></div>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [], clouds = [], waterTime = 0;

    function forceHardRefresh() {
      const url = window.location.href.split('?')[0];
      window.location.href = url + '?v=' + Date.now();
    }

    // Wolken + Vögel + Sand (Basis)
    function spawnCloud() { /* ... */ }
    for (let i = 0; i < 6; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320; sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 510);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 6200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*510, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() { /* ... */ }
    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel + Sonne
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa'); sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, 1320, 250);

      const sunX = 1050, sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c'; ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25; ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      ctx.drawImage(sandCanvas, 0, 250);

      // === NATÜRLICHES SEEUFER LINKS OBEN ===
      const x = 90;

      // Braunes Ufer (flach abfallend, natürlich)
      ctx.fillStyle = '#8d6f47';
      ctx.beginPath();
      ctx.moveTo(x, 255);
      ctx.quadraticCurveTo(x + 95, 222, x + 185, 245);
      ctx.quadraticCurveTo(x + 265, 208, x + 355, 238);
      ctx.quadraticCurveTo(x + 415, 255, x + 460, 295);
      ctx.lineTo(x + 465, 385);
      ctx.lineTo(x - 25, 390);
      ctx.closePath();
      ctx.fill();

      // Wasser (flach abfallend)
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.moveTo(x + 25, 262);
      ctx.quadraticCurveTo(x + 110, 290, x + 195, 265);
      ctx.quadraticCurveTo(x + 270, 305, x + 355, 275);
      ctx.lineTo(x + 445, 370);
      ctx.lineTo(x + 35, 372);
      ctx.closePath();
      ctx.fill();

      // Wellen
      waterTime += 0.055;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 45, 278 + i*24);
        for (let px = 70; px < 380; px += 32) {
          ctx.quadraticCurveTo(x + px, 274 + i*24 + Math.sin(waterTime + px*0.04) * 7, x + px + 32, 278 + i*24);
        }
        ctx.stroke();
      }
    }

    // Cloud & Bird Funktionen (wie vorher) ...

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      // Clouds + Birds ...

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
