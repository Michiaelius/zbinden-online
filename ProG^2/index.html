<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik — Entdecke & Baue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a2a4a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: linear-gradient(#1e4a7a, #0f3560);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 6px solid #bae6fd;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #header h1 {
      font-size: 2rem;
      text-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }

    #toolbar {
      background: linear-gradient(#1e4a7a, #1e3a5f);
      padding: 12px 20px;
      display: flex;
      gap: 18px;
      justify-content: center;
      border-bottom: 4px solid #bae6fd;
    }

    .tool {
      width: 78px;
      height: 78px;
      background: #67e8f9;
      border-radius: 20px;
      font-size: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4),
                  inset 0 4px 10px rgba(255,255,255,0.5);
      transition: all 0.25s;
      border: 4px solid #22d3ee;
    }

    .tool:hover {
      transform: scale(1.2) translateY(-8px);
    }

    /* === BESSERES WASSER === */
    #water-reservoir {
      height: 160px;
      background: linear-gradient(
        to bottom,
        #0c4a8a 0%,
        #1e70c0 30%,
        #3b9be0 55%,
        #60c0f0 80%,
        #a0e0ff 100%
      );
      position: relative;
      overflow: hidden;
      border-bottom: 12px solid #1e4a7a;
      box-shadow: inset 0 20px 40px rgba(0,0,0,0.4);
    }

    /* Wasseroberfläche */
    #water-reservoir::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.45),
        rgba(255,255,255,0.15) 50%,
        transparent
      );
      animation: waterShimmer 8s linear infinite;
    }

    /* Wellen-Layer 1 */
    #water-reservoir::after {
      content: '';
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      height: 80px;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 20px,
        rgba(255,255,255,0.12) 20px,
        rgba(255,255,255,0.12) 40px
      );
      animation: waveFlow 12s linear infinite;
      opacity: 0.6;
    }

    @keyframes waterShimmer {
      0% { transform: translateX(-30%); }
      100% { transform: translateX(30%); }
    }

    @keyframes waveFlow {
      0% { background-position: 0 0; }
      100% { background-position: 200px 0; }
    }

    #playground {
      flex: 1;
      background: 
        linear-gradient(#e2c18a, #c99a5f),
        url('https://i.imgur.com/8ZfK8vL.jpg') repeat;
      background-size: cover;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 30px 80px rgba(0,0,0,0.65);
    }

    .element {
      position: absolute;
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      cursor: move;
      filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>💧 Wasser-Logik — Entdecke & Baue</h1>
    <button id="mode-switch">Zu Baustein-Modus</button>
  </div>

  <div id="toolbar">
    <div class="tool" data-type="source" title="Wasserquelle">🚰</div>
    <div class="tool" data-type="pipe"   title="Rohr">🟦</div>
    <div class="tool" data-type="and"    title="UND">🔗</div>
    <div class="tool" data-type="not"    title="NICHT">⭯</div>
    <div class="tool" data-type="sink"   title="Ziel">🪣</div>
  </div>

  <div id="water-reservoir"></div>
  <div id="playground"></div>

  <script>
    // (Script bleibt gleich wie vorher)
    const playground = document.getElementById('playground');
    const tools = document.querySelectorAll('.tool');

    function makeDraggable(el) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      el.onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    function createElement(type, x, y) {
      const el = document.createElement('div');
      el.className = 'element';
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const symbols = { source: '🚰', pipe: '🟦', and: '🔗', not: '⭯', sink: '🪣' };
      el.textContent = symbols[type] || '❓';
      
      makeDraggable(el);
      playground.appendChild(el);
    }

    tools.forEach(tool => {
      tool.addEventListener('click', () => {
        const type = tool.dataset.type;
        const centerX = (playground.offsetWidth / 2) - 40;
        const centerY = 120;
        createElement(type, centerX, centerY);
      });
    });
  </script>
</body>
</html>
