<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik — Entdecke & Baue</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Comic Sans MS', Arial, sans-serif;
      background: #0a2a4a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: linear-gradient(#1e4a7a, #0f3560);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #header h1 {
      font-size: 2.1rem;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
    }

    /* Cartoon Wasser wie „Wo ist mein Wasser?“ */
    #water-reservoir {
      height: 170px;
      background: linear-gradient(#0ea5e9, #38bdf8, #7dd3fc);
      position: relative;
      overflow: hidden;
      border-bottom: 15px solid #1e40af;
      box-shadow: inset 0 25px 40px rgba(0,0,0,0.5);
    }

    #water-reservoir::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.1) 40%,
        transparent 70%
      );
      animation: waterSurface 4s ease-in-out infinite alternate;
    }

    @keyframes waterSurface {
      from { transform: translateY(-8px); }
      to   { transform: translateY(8px); }
    }

    #playground {
      flex: 1;
      background: 
        linear-gradient(#e2c18a 0%, #c99a5f 100%),
        url('https://i.imgur.com/8ZfK8vL.jpg') repeat;
      background-size: cover;
      position: relative;
      overflow: hidden;
      cursor: url('https://i.imgur.com/5fK9pL2.png') 16 32, auto; /* Schaufel-Cursor */
    }

    .dug {
      background: #8d6f47 !important;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>💧 Wasser-Logik</h1>
    <div>Level 1 — Lerne graben</div>
  </div>

  <div id="water-reservoir"></div>
  <div id="playground"></div>

  <script>
    const playground = document.getElementById('playground');

    // Graben mit Klick
    playground.addEventListener('click', (e) => {
      const hole = document.createElement('div');
      hole.style.position = 'absolute';
      hole.style.left = (e.offsetX - 35) + 'px';
      hole.style.top = (e.offsetY - 35) + 'px';
      hole.style.width = '70px';
      hole.style.height = '70px';
      hole.style.borderRadius = '50%';
      hole.style.background = 'transparent';
      hole.style.pointerEvents = 'none';
      hole.classList.add('dug');
      
      playground.appendChild(hole);

      // Später: Wasser fließt hier durch
      console.log("Gegraben bei:", e.offsetX, e.offsetY);
    });

    // Hinweis
    window.onload = () => {
      console.log("✅ Level 1 gestartet. Klicke mit der Maus in den Sand zum Graben.");
    };
  </script>
</body>
</html>
