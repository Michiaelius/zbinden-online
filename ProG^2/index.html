<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background: #0a2a4a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh;
    }
    #game-container {
      border: 10px solid #1e40af;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.holes = [];
      }

      preload() {
        // Später echte Bilder laden
      }

      create() {
        const w = 1000;
        const h = 620;

        // Sand-Hintergrund mit Textur
        this.add.rectangle(w/2, h/2 + 80, w, h, 0xe2c18a);

        // Sand-Textur (Punkte)
        for (let i = 0; i < 1200; i++) {
          const x = Math.random() * w;
          const y = 180 + Math.random() * (h - 200);
          const size = Math.random() * 4 + 2;
          this.add.circle(x, y, size, 0xc99a5f);
        }

        // Wasserbehälter (cartooniger)
        const waterGroup = this.add.container(0, 0);

        const water = this.add.rectangle(w/2, 110, w, 170, 0x38bdf8);
        water.setStrokeStyle(18, 0x1e40af);
        waterGroup.add(water);

        // Wasser-Glanz
        const shine = this.add.rectangle(w/2, 80, w-60, 50, 0xffffff);
        shine.setAlpha(0.35);
        waterGroup.add(shine);

        // Leichte Wasserbewegung
        this.tweens.add({
          targets: water,
          y: 118,
          duration: 2200,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        this.tweens.add({
          targets: shine,
          y: 72,
          duration: 2800,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // Titel
        this.add.text(w/2, 35, '💧 Wasser-Logik', {
          fontSize: '48px',
          color: '#fff',
          fontStyle: 'bold',
          stroke: '#1e40af',
          strokeThickness: 8
        }).setOrigin(0.5);

        // Level Info
        this.add.text(w/2, 75, 'Level 1 — Lerne mit der Schaufel zu graben', {
          fontSize: '22px',
          color: '#bae6fd'
        }).setOrigin(0.5);

        // Grab-Mechanik
        this.input.on('pointerdown', (pointer) => {
          if (pointer.y < 190) return; // nicht ins Wasser klicken

          const hole = this.add.circle(pointer.x, pointer.y, 42, 0x8d6f47);
          hole.setStrokeStyle(8, 0x6b5a3d);
          this.holes.push(hole);

          console.log(`Kanal gegraben bei ${pointer.x.toFixed(0)}, ${pointer.y.toFixed(0)}`);
        });

        // Hinweis-Text
        this.helpText = this.add.text(w/2, h - 40, '👇 Klicke in den Sand, um Kanäle zu graben', {
          fontSize: '24px',
          color: '#fef08c'
        }).setOrigin(0.5);
      }

      update() {
        // Später Wasser-Simulation
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1000,
      height: 620,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
