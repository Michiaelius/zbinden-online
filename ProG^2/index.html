<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let cloud1X = 180;
    let cloud2X = 780;

    let birds = [];

    // Fixierter Sand
    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 350;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 350);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 5200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*350, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() {
      const fromLeft = Math.random() > 0.5;
      birds.push({
        x: fromLeft ? -60 : 1380,
        y: 120 + Math.random() * 160,
        speed: 1.1 + Math.random() * 1.1,
        direction: fromLeft ? 1 : -1,
        flap: Math.random() * 10,
        size: 0.75 + Math.random() * 0.4   // etwas Variation in Größe
      });
    }

    // Initial ein paar Vögel
    for (let i = 0; i < 5; i++) spawnBird();

    function drawStaticBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, 460);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 460);

      // Sonne
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(1080, 170, 82, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(1080, 170, 63, 0, Math.PI*2); ctx.fill();

      ctx.drawImage(sandCanvas, 0, 410);
    }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 7;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.direction < 0) ctx.scale(-1, 1);   // umdrehen bei Flug nach links

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 3.2;

      // Flügel
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, -18 + flap, 34, -9);
      ctx.quadraticCurveTo(26, -4, 10, 4);
      ctx.fill();
      ctx.stroke();

      // Körper
      ctx.beginPath();
      ctx.ellipse(19, 5, 13, 8, 0.2, 0, Math.PI*2);
      ctx.fill();

      // Kopf
      ctx.beginPath();
      ctx.arc(30, 1, 6.5, 0, Math.PI*2);
      ctx.fill();

      // Schnabel
      ctx.beginPath();
      ctx.moveTo(35, 0);
      ctx.lineTo(43, 2);
      ctx.lineTo(35, 4);
      ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      // Wolken
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(cloud1X, 130, 128, 48, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud1X + 95, 110, 85, 39, 0, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.ellipse(cloud2X, 170, 118, 45, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud2X + 92, 150, 78, 36, 0, 0, Math.PI*2); ctx.fill();

      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 460);

      drawStaticBackground();
      drawMovingElements();

      // Wolken
      cloud1X += 0.42;
      cloud2X += 0.37;
      if (cloud1X > 1650) cloud1X = -320;
      if (cloud2X > 1650) cloud2X = -280;

      // Vögel updaten
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.x += b.speed * b.direction;
        b.flap += 0.25;

        // Entfernen wenn außerhalb
        if (b.x < -100 || b.x > 1420) {
          birds.splice(i, 1);
          spawnBird();   // neuen Vogel spawnen
        }
      }

      // Gelegentlich neuen Vogel spawnen
      if (Math.random() < 0.03) spawnBird();

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
