<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik</title>
  <style>
    body {
      margin: 0; padding: 0; background: #0a2a4a;
      display: flex; justify-content: center; align-items: center; height: 100vh;
    }
    #game { border: 18px solid #1e40af; border-radius: 28px; box-shadow: 0 0 90px rgba(0,0,0,0.95); overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    const canvas = document.createElement('canvas');
    canvas.width = 1100;
    canvas.height = 680;
    document.getElementById('game').appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 20; // für späteres Wasser-Fließen wichtig

    let isDigging = false;

    // === Schöner Hintergrund ===
    function drawBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 280);
      sky.addColorStop(0, '#7dd3fc');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1100, 280);

      // Sonne
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(880, 115, 65, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(880, 115, 50, 0, Math.PI*2); ctx.fill();

      // Wolken (einfach)
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(220, 90, 80, 35, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(280, 75, 55, 30, 0, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 220, 1100, 460);

      // Sand Textur
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 3200; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*1100, 230 + Math.random()*440, Math.random()*4 + 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    drawBackground();

    // === Wasserbehälter (jetzt mit Wellen) ===
    function drawWaterReservoir() {
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 72, 1100, 165);

      ctx.strokeStyle = '#1e40af';
      ctx.lineWidth = 28;
      ctx.strokeRect(0, 72, 1100, 165);

      // Wellen
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 6;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 95 + i*8);
        ctx.quadraticCurveTo(250, 78 + i*5, 550, 96 + i*7);
        ctx.quadraticCurveTo(850, 115 + i*4, 1100, 92 + i*6);
        ctx.stroke();
      }

      // Glanz
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(50, 82, 1000, 45);
    }

    drawWaterReservoir();

    // Titel
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💧 Wasser-Logik', 550, 48);

    ctx.font = '26px Arial';
    ctx.fillStyle = '#bae6fd';
    ctx.fillText('Level 1 — Graben & Wasser lenken', 550, 82);

    ctx.font = '23px Arial';
    ctx.fillStyle = '#fef08c';
    ctx.fillText('🖱️ Maustaste halten und ziehen = Kanal graben', 550, 645);

    // === Graben mit besserer Kontrolle ===
    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < 230) return;
      isDigging = true;
      digAt(x, y);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDigging) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (y < 230) return;
      digAt(x, y);
    });

    canvas.addEventListener('mouseup', () => isDigging = false);
    canvas.addEventListener('mouseleave', () => isDigging = false);

    function digAt(x, y) {
      // Dunkler Rand
      ctx.fillStyle = '#6b5a3d';
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI*2);
      ctx.fill();

      // Innerer Sand-Kanal
      ctx.fillStyle = '#8d6f47';
      ctx.beginPath();
      ctx.arc(x, y, 17, 0, Math.PI*2);
      ctx.fill();
    }
  </script>
</body>
</html>
