<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body {
      margin:0; padding:20px 0; background:#0a2a4a;
      display:flex; flex-direction:column; align-items:center;
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas {
      border: 25px solid #1e40af;
      border-radius: 25px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    function spawnCloud() {
      const type = Math.random(); 
      const isFar = Math.random() > 0.45;
      const fromLeft = Math.random() > 0.5;

      clouds.push({
        x: fromLeft ? -380 : 1700,
        y: isFar ? 38 + Math.random() * 58 : 72 + Math.random() * 72,
        size: isFar ? 0.48 + Math.random() * 0.35 : 0.75 + Math.random() * 0.55,
        speed: isFar ? 0.055 + Math.random() * 0.045 : 0.085 + Math.random() * 0.06,
        direction: fromLeft ? 1 : -1,
        opacity: isFar ? 0.68 : 0.93,
        pause: 0,
        life: 1.0,
        dissolving: Math.random() < 0.1,
        type: type < 0.4 ? 1 : type < 0.75 ? 2 : 3,
        lastTurn: Date.now()
      });
    }
    for (let i = 0; i < 8; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320; sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 510);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 6200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*510, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const count = Math.random() < 0.7 ? 1 : 2;
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -90 - i*40 : 1410 + i*40,
          y: 95 + Math.random() * 115,
          baseY: 95 + Math.random() * 115,
          speed: 1.05 + Math.random() * 0.75,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: Date.now()
        });
      }
    }
    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      ctx.drawImage(sandCanvas, 0, 250);
    }

    function drawCloud(cloud) {
      ctx.globalAlpha = cloud.opacity * cloud.life;
      const s = cloud.size;
      const x = cloud.x;
      const y = cloud.y;
      ctx.fillStyle = '#ffffff';

      if (cloud.type === 1) {
        ctx.beginPath(); ctx.ellipse(x, y, 115*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 82*s, y - 18*s, 72*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 40*s, y - 26*s, 52*s, 33*s, 0, 0, Math.PI*2); ctx.fill();
      } else if (cloud.type === 2) {
        ctx.beginPath(); ctx.ellipse(x, y, 160*s, 35*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 95*s, y - 14*s, 85*s, 32*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 45*s, y - 22*s, 55*s, 28*s, 0, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.ellipse(x, y, 68*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 48*s, y - 12*s, 52*s, 32*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x - 35*s, y - 10*s, 45*s, 29*s, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 10;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.roll !== 0) ctx.rotate(bird.roll);
      if (bird.direction < 0) ctx.scale(-1, 1);   // Spiegelung für Linksflug
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 2.6;

      // Schwanz
      ctx.beginPath();
      ctx.moveTo(8, 8);
      ctx.lineTo(1, 6);
      ctx.lineTo(2, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Flügel
      ctx.beginPath();
      ctx.moveTo(22, 10);
      ctx.quadraticCurveTo(14, -23 + flap*1.3, 25,-14 );
      ctx.quadraticCurveTo(38, 0, 15,5);
      ctx.fill();
      ctx.stroke();

      // Körper
      ctx.beginPath(); 
      ctx.ellipse(19.5, 7.5, 10, 5, 0.05, 0, Math.PI*2); 
      ctx.fill();

      // Kopf
      ctx.beginPath(); 
      ctx.arc(29, 4, 6, 0, Math.PI*2); 
      ctx.fill();

      // Schnabel – immer nach vorne (rechts bei Normal, links bei Spiegelung)
      ctx.beginPath(); 
      ctx.moveTo(34, 3); 
      ctx.lineTo(45, 4);     // länger nach vorne
      ctx.lineTo(34, 5.5); 
      ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        if (c.pause > 0) c.pause--;
        else c.x += c.speed * c.direction;

        if (Math.random() < 0.0018) c.pause = 140 + Math.random()*180;

        if (c.dissolving) c.life -= 0.006;
        else if (Math.random() < 0.0004) c.dissolving = true;

        if (c.x < -550 || c.x > 1880 || c.life <= 0) clouds.splice(i, 1);
      }
      if (clouds.length < 12 && Math.random() < 0.038) spawnCloud();

      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0028;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 22;
        b.flap += 0.22;

        if (Math.random() < 0.008) b.rollSpeed = (Math.random() - 0.5) * 0.25;
        b.roll += b.rollSpeed;
        if (Math.abs(b.roll) > 0.35) b.rollSpeed *= -0.7;

        if (Date.now() - b.lastTurn > 15000 && Math.random() < 0.0015) {
          b.direction *= -1;
          b.lastTurn = Date.now();
        }

        if (b.x < -180 || b.x > 1500) birds.splice(i, 1);
      }
      if (birds.length < 3 && Math.random() < 0.006) spawnBird();

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
