<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body { margin:0; padding:20px 0; background:#0a2a4a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family: Arial, sans-serif; }
    .header { width: 1320px; background: linear-gradient(#1e3a8a, #3b82f6); padding: 20px 0; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 15px; text-align: center; }
    canvas { border: 25px solid #1e40af; border-radius: 25px; box-shadow: 0 25px 90px rgba(0,0,0,0.95); }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    function spawnCloud() {
      const isFar = Math.random() > 0.45;
      const fromLeft = Math.random() > 0.5;
      clouds.push({
        x: fromLeft ? -380 : 1700,
        y: isFar ? 45 + Math.random() * 55 : 75 + Math.random() * 65,
        size: isFar ? 0.5 + Math.random() * 0.35 : 0.75 + Math.random() * 0.5,
        speed: isFar ? 0.055 + Math.random() * 0.04 : 0.09 + Math.random() * 0.05,
        direction: fromLeft ? 1 : -1,
        life: 1.0,
        dissolving: false
      });
    }
    for (let i = 0; i < 9; i++) spawnCloud();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      birds.push({
        x: dir > 0 ? -120 : 1440,
        y: 105 + Math.random() * 125,
        baseY: 105 + Math.random() * 125,
        speed: 1.1 + Math.random() * 0.8,
        direction: dir,
        flap: Math.random() * 10,
        scale: 0.38 + Math.random() * 0.32,
        wave: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 4; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 260);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 260);

      // Sonne
      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 55;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 260, 1320, 500);
    }

    function drawBird(b) {
      const flap = Math.sin(b.flap) * 11;
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b.direction < 0) ctx.scale(-1, 1);
      ctx.scale(b.scale, b.scale);

      ctx.fillStyle = '#1e2937';
      ctx.strokeStyle = '#1e2937';
      ctx.lineWidth = 2.6;

      // Schwanz
      ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(1,4); ctx.lineTo(2,13); ctx.fill();
      // Flügel
      ctx.beginPath(); ctx.moveTo(23,13); ctx.quadraticCurveTo(11, -24 + flap*4.5, 11, -3); ctx.quadraticCurveTo(22,5,15,13); ctx.fill();
      // Körper
      ctx.beginPath(); ctx.ellipse(19,8,10,7,0,0,Math.PI*2); ctx.fill();
      // Kopf
      ctx.beginPath(); ctx.arc(29,5,6,0,Math.PI*2); ctx.fill();
      // Schnabel
      ctx.beginPath(); ctx.moveTo(34,3); ctx.lineTo(45,4); ctx.lineTo(34,6); ctx.fill();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();

      // Wolken
      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        c.x += c.speed * c.direction;
        if (Math.random() < 0.0006) c.dissolving = true;
        if (c.dissolving) c.life -= 0.007;
        if (c.x < -600 || c.x > 1900 || c.life <= 0) clouds.splice(i, 1);
      }
      if (clouds.length < 10 && Math.random() < 0.035) spawnCloud();

      // Vögel
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0017;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 15;
        b.flap += 0.06;

        drawBird(b);

        if (b.x < -250 || b.x > 1570) birds.splice(i, 1);
      }

      if (birds.length < 5 && Math.random() < 0.018) spawnBird();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
