<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a2a4a; display:flex; justify-content:center; align-items:center; height:100vh; }
    #game-container { border:10px solid #1e40af; border-radius:12px; box-shadow:0 0 40px rgba(0,0,0,0.8); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.holes = [];
        this.lastDigPos = null;
        this.isDigging = false;
      }

      create() {
        const w = 1000;
        const h = 620;

        // Sand
        this.add.rectangle(w/2, h/2 + 80, w, h, 0xe2c18a);

        // Feine Sand-Textur
        for (let i = 0; i < 1800; i++) {
          const x = Math.random() * w;
          const y = 190 + Math.random() * (h - 230);
          this.add.circle(x, y, Math.random()*3 + 1.5, 0xc99a5f);
        }

        // Wasserbehälter
        this.water = this.add.rectangle(w/2, 135, w, 170, 0x38bdf8);
        this.water.setStrokeStyle(18, 0x1e40af);

        this.shine = this.add.rectangle(w/2, 95, w-70, 50, 0xffffff).setAlpha(0.38);

        this.tweens.add({ targets: this.water, y: 148, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        this.tweens.add({ targets: this.shine, y: 85, duration: 2200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        this.add.text(w/2, 38, '💧 Wasser-Logik', { fontSize: '48px', color: '#fff', fontStyle: 'bold', stroke: '#1e40af', strokeThickness: 8 }).setOrigin(0.5);
        this.add.text(w/2, 78, 'Level 1 — Graben & Wasser lenken', { fontSize: '24px', color: '#bae6fd' }).setOrigin(0.5);

        // ==================== GRAB-MECHANIK ====================
        this.input.on('pointerdown', (p) => {
          if (p.y < 190) return;
          this.isDigging = true;
          this.lastDigPos = {x: p.x, y: p.y};
          this.digAt(p.x, p.y);
        });

        this.input.on('pointermove', (p) => {
          if (!this.isDigging || p.y < 190) return;

          // Linie zwischen letzter Position und aktueller Position graben
          if (this.lastDigPos) {
            this.drawDigLine(this.lastDigPos.x, this.lastDigPos.y, p.x, p.y);
          }
          this.lastDigPos = {x: p.x, y: p.y};
          this.digAt(p.x, p.y);
        });

        this.input.on('pointerup', () => {
          this.isDigging = false;
          this.lastDigPos = null;
        });

        this.helpText = this.add.text(w/2, h - 35, '🖱️ Maustaste halten + ziehen = Kanal graben', {
          fontSize: '23px', color: '#fef08c'
        }).setOrigin(0.5);
      }

      digAt(x, y) {
        const hole = this.add.circle(x, y, 26, 0x8d6f47);
        hole.setStrokeStyle(5, 0x6b5a3d);
        this.holes.push(hole);
      }

      drawDigLine(x1, y1, x2, y2) {
        const distance = Phaser.Math.Distance.Between(x1, y1, x2, y2);
        const steps = Math.max(1, Math.floor(distance / 18)); // alle ~18 Pixel ein Loch

        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = Phaser.Math.Linear(x1, x2, t);
          const y = Phaser.Math.Linear(y1, y2, t);
          this.digAt(x, y);
        }
      }

      update() {
        // Einfache Wasser-Tropfen, die in Kanäle fallen sollen
        if (Phaser.Math.Between(1, 6) === 1) {
          this.dropWater();
        }
      }

      dropWater() {
        const drop = this.add.circle(Phaser.Math.Between(150, 850), 155, 11, 0x67e8f9);
        drop.setAlpha(0.85);

        this.tweens.add({
          targets: drop,
          y: 620,
          duration: 1400 + Phaser.Math.Between(400, 1200),
          onComplete: () => drop.destroy()
        });
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1000,
      height: 620,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
