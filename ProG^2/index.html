<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik • Phaser</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background: #0a2a4a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    #game-container {
      border: 8px solid #1e4a7a;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
      }

      preload() {
        // Hier kommen später Bilder hin
        console.log('Preload...');
      }

      create() {
        const width = 1000;
        const height = 600;

        // Hintergrund Sand
        this.add.rectangle(width/2, height/2, width, height, 0xd4b38a);

        // Cartoon Wasser oben (wie "Wo ist mein Wasser?")
        const water = this.add.rectangle(width/2, 100, width, 180, 0x38bdf8);
        water.setStrokeStyle(12, 0x1e40af);

        // Wasser-Oberfläche Effekt
        this.tweens.add({
          targets: water,
          y: 105,
          duration: 1800,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // Titel
        this.add.text(width/2, 40, '💧 Wasser-Logik', {
          fontSize: '42px',
          color: '#fff',
          fontStyle: 'bold'
        }).setOrigin(0.5);

        // Hinweis
        this.add.text(width/2, height - 50, 'Klicke in den Sand zum Graben (Level 1)', {
          fontSize: '22px',
          color: '#fff'
        }).setOrigin(0.5);

        // Einfaches Graben
        this.input.on('pointerdown', (pointer) => {
          const x = pointer.x;
          const y = pointer.y;

          if (y > 200) { // nur unter dem Wasser graben
            const hole = this.add.circle(x, y, 38, 0x8d6f47);
            hole.setDepth(1);
            
            console.log(`Gegraben bei ${x}, ${y}`);
          }
        });
      }

      update() {
        // Später für Wasser-Simulation
      }
    }

    // Game starten
    const config = {
      type: Phaser.AUTO,
      width: 1000,
      height: 600,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
