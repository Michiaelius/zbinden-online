<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];
    let waterTime = 0;

    function spawnCloud() {
      const isFar = Math.random() > 0.6;
      clouds.push({
        x: Math.random() > 0.5 ? -280 : 1600,
        y: isFar ? 55 + Math.random() * 45 : 78 + Math.random() * 55,
        size: isFar ? 0.38 + Math.random() * 0.32 : 0.52 + Math.random() * 0.38,
        speed: isFar ? 0.028 + Math.random() * 0.035 : 0.042 + Math.random() * 0.045,
        direction: Math.random() > 0.5 ? 1 : -1,
        opacity: isFar ? 0.7 : 0.92,
        pause: 0,
        life: 1.0,
        dissolving: false
      });
    }

    for (let i = 0; i < 3; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 510;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 510);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 6200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*510, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const count = Math.random() < 0.7 ? 1 : 2;
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -90 - i*40 : 1410 + i*40,
          y: 95 + Math.random() * 115,
          baseY: 95 + Math.random() * 115,
          speed: 1.05 + Math.random() * 0.75,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: Date.now()
        });
      }
    }

    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel (1/3)
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      // Sonne
      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(sunX, sunY, 27, 0, Math.PI*2); ctx.fill();

      // Sandbereich
      ctx.drawImage(sandCanvas, 0, 250);

      // === ZIEL-BEREICH (See / Wasserbecken im Schnitt) ===
      const basinY = 620;
      const basinH = 120;

      // Wasser im Becken
      ctx.fillStyle = '#0ea5e9';
      ctx.fillRect(780, basinY, 480, basinH);

      // Wellen im Becken
      waterTime += 0.045;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(800, basinY + 25 + i*22);
        for (let x = 820; x < 1220; x += 35) {
          ctx.quadraticCurveTo(
            x - 15, basinY + 20 + i*22 + Math.sin(waterTime + x*0.02) * 8,
            x + 20, basinY + 25 + i*22
          );
        }
        ctx.stroke();
      }

      // Becken-Rand (Erde / Stein)
      ctx.fillStyle = '#8d6f47';
      ctx.fillRect(760, basinY - 25, 520, 35);
    }

    function drawCloud(cloud) { /* gleiche Funktion wie vorher */ 
      ctx.globalAlpha = cloud.opacity * cloud.life;
      const s = cloud.size;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.ellipse(cloud.x, cloud.y, 115*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 78*s, cloud.y - 16*s, 68*s, 36*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 38*s, cloud.y - 22*s, 48*s, 31*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawBird(bird) { /* gleiche Funktion */ 
      const flap = Math.sin(bird.flap) * 7;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.roll !== 0) ctx.rotate(bird.roll);
      if (bird.direction < 0) ctx.scale(-1, 1);
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 3.2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, -19 + flap, 35, -10);
      ctx.quadraticCurveTo(26, -5, 11, 4);
      ctx.fill(); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(19, 5, 13, 8, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30, 1, 6.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(35, 0); ctx.lineTo(43, 2); ctx.lineTo(35, 4); ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();
      drawMovingElements();

      // Wolken + Vögel Update (wie in der letzten guten Version)

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
