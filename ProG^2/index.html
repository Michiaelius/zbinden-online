<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { margin:0; padding:0; background:#0a2a4a; display:flex; justify-content:center; align-items:center; height:100vh; }
    canvas { border:20px solid #1e40af; border-radius:30px; box-shadow:0 0 100px rgba(0,0,0,0.9); }
  </style>
</head>
<body>
  <canvas id="game" width="1200" height="750"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function drawBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 320);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1200, 320);

      // Sonne
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(950, 130, 70, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(950, 130, 55, 0, Math.PI*2); ctx.fill();

      // Wolken
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.ellipse(280, 95, 95, 38, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(340, 80, 65, 32, 0, 0, Math.PI*2); ctx.fill();

      // Sand
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 250, 1200, 500);

      // Sandkörner
      ctx.fillStyle = '#c99a5f';
      for (let i = 0; i < 3500; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*1200, 260 + Math.random()*480, Math.random()*4.5 + 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    drawBackground();

    // Titel
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 62px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('💧 Wasser-Logik', 600, 55);

    ctx.font = '27px Arial';
    ctx.fillStyle = '#bae6fd';
    ctx.fillText('Level 1 — Graben & Wasser lenken', 600, 92);
  </script>
</body>
</html>
