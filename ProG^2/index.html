<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body {
      margin:0; padding:20px 0; background:#0a2a4a;
      display:flex; flex-direction:column; align-items:center;
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas {
      border: 25px solid #1e40af;
      border-radius: 25px;
      box-shadow: 0 25px 90px rgba(0,0,0,0.95);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    // Sand Textur
    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 500;
    const sandCtx = sandCanvas.getContext('2d');
    sandCtx.fillStyle = '#e2c18a';
    sandCtx.fillRect(0, 0, 1320, 500);
    sandCtx.fillStyle = '#d4a76a';
    for (let i = 0; i < 7200; i++) {
      sandCtx.fillRect(Math.random()*1320, Math.random()*500, 2.5 + Math.random()*2, 2.5 + Math.random()*2);
    }

    function spawnCloud() {
      const type = Math.random();
      const isFar = Math.random() > 0.45;
      const fromLeft = Math.random() > 0.5;
      clouds.push({
        x: fromLeft ? -380 : 1700,
        y: isFar ? 42 + Math.random() * 58 : 72 + Math.random() * 68,
        size: isFar ? 0.48 + Math.random() * 0.35 : 0.78 + Math.random() * 0.52,
        speed: isFar ? 0.052 + Math.random() * 0.038 : 0.085 + Math.random() * 0.055,
        direction: fromLeft ? 1 : -1,
        life: 1.0,
        dissolving: Math.random() < 0.1,
        type: type
      });
    }
    for (let i = 0; i < 9; i++) spawnCloud();

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      birds.push({
        x: dir > 0 ? -140 : 1460,
        y: 98 + Math.random() * 118,
        baseY: 98 + Math.random() * 118,
        speed: 1.15 + Math.random() * 0.75,
        direction: dir,
        flap: Math.random() * 10,
        scale: 0.36 + Math.random() * 0.34,
        wave: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 4; i++) spawnBird();

    function drawStaticBackground() {
      // Himmel
      const sky = ctx.createLinearGradient(0, 0, 0, 270);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 270);

      // Sonne
      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 60;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();
      
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;

      // Sand
      ctx.drawImage(sandCanvas, 0, 260);
    }

    function drawCloud(c) {
      ctx.globalAlpha = c.life;
      ctx.fillStyle = '#ffffff';
      const s = c.size;
      const x = c.x;
      const y = c.y;

      if (c.type < 0.4) {
        ctx.beginPath(); ctx.ellipse(x, y, 118*s, 38*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 78*s, y - 19*s, 72*s, 35*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 38*s, y - 26*s, 55*s, 31*s, 0, 0, Math.PI*2); ctx.fill();
      } else if (c.type < 0.75) {
        ctx.beginPath(); ctx.ellipse(x, y, 145*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 92*s, y - 22*s, 82*s, 36*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 45*s, y - 28*s, 62*s, 33*s, 0, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.ellipse(x, y, 98*s, 35*s, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(x + 65*s, y - 16*s, 58*s, 32*s, 0, 0, Math.PI*2); ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawBird(b) {
      const flap = Math.sin(b.flap) * 11;
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b.direction < 0) ctx.scale(-1, 1);
      ctx.scale(b.scale, b.scale);

      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 2.6;

      ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(0,4); ctx.lineTo(2,13); ctx.fill(); // Schwanz
      ctx.beginPath(); ctx.moveTo(23,13); ctx.quadraticCurveTo(11, -25 + flap*4.5, 11, -3); ctx.quadraticCurveTo(22,5,15,13); ctx.fill(); // Flügel
      ctx.beginPath(); ctx.ellipse(19,8,10,7,0,0,Math.PI*2); ctx.fill(); // Körper
      ctx.beginPath(); ctx.arc(29,5,6,0,Math.PI*2); ctx.fill(); // Kopf
      ctx.beginPath(); ctx.moveTo(34,3); ctx.lineTo(46,4); ctx.lineTo(34,6); ctx.fill(); // Schnabel

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();

      // Wolken
      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        c.x += c.speed * c.direction;
        if (Math.random() < 0.0007) c.dissolving = true;
        if (c.dissolving) c.life -= 0.007;

        drawCloud(c);

        if (c.x < -700 || c.x > 1950 || c.life <= 0) clouds.splice(i, 1);
      }
      if (clouds.length < 11 && Math.random() < 0.032) spawnCloud();

      // Vögel
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0017;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 15;
        b.flap += 0.06;

        drawBird(b);

        if (b.x < -280 || b.x > 1600) birds.splice(i, 1);
      }

      if (birds.length < 5 && Math.random() < 0.019) spawnBird();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
