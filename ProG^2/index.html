<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasser-Logik</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.1.0/dist/phaser.min.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a2a4a; display:flex; justify-content:center; align-items:center; height:100vh; }
    #game-container { border:12px solid #1e40af; border-radius:16px; box-shadow:0 0 50px rgba(0,0,0,0.9); }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    class MainScene extends Phaser.Scene {
      constructor() {
        super('MainScene');
        this.channels = []; // für spätere Physik
        this.isDigging = false;
      }

      create() {
        const w = 1100;
        const h = 680;

        // Sand
        this.add.rectangle(w/2, h/2 + 90, w, h, 0xe2c18a);

        // Sand-Textur
        for (let i = 0; i < 1800; i++) {
          this.add.circle(Math.random()*w, 210 + Math.random()*(h-260), Math.random()*3.5 + 1.5, 0xc99a5f);
        }

        // Wasserbehälter (ruhig)
        this.water = this.add.rectangle(w/2, 145, w, 175, 0x38bdf8);
        this.water.setStrokeStyle(20, 0x1e40af);
        this.shine = this.add.rectangle(w/2, 105, w-100, 55, 0xffffff).setAlpha(0.35);

        this.tweens.add({ targets: this.water, y: 150, duration: 3200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        this.add.text(w/2, 42, '💧 Wasser-Logik', { fontSize: '52px', color: '#fff', fontStyle: 'bold', stroke: '#1e40af', strokeThickness: 10 }).setOrigin(0.5);
        this.add.text(w/2, 85, 'Level 1 — Graben & Wasser lenken', { fontSize: '26px', color: '#bae6fd' }).setOrigin(0.5);

        // ==================== BESSERES GRABEN ====================
        this.input.on('pointerdown', (p) => {
          if (p.y < 200) return;
          this.isDigging = true;
          this.digLine(p.x, p.y, p.x, p.y);
        });

        this.input.on('pointermove', (p) => {
          if (this.isDigging && p.y > 200) {
            this.digLine(p.x - 8, p.y, p.x + 8, p.y); // dickere Linie
          }
        });

        this.input.on('pointerup', () => this.isDigging = false);

        this.helpText = this.add.text(w/2, h - 40, '🖱️ Maustaste halten und ziehen = Kanal graben', {
          fontSize: '24px', color: '#fef08c'
        }).setOrigin(0.5);
      }

      // Bessere Kanal-Visualisierung (dicke Linie statt Kreise)
      digLine(x1, y1, x2, y2) {
        const line = this.add.graphics();
        line.lineStyle(48, 0x8d6f47, 1);           // dicke braune Linie
        line.lineBetween(x1, y1, x2, y2);
        line.lineStyle(32, 0x6b5a3d, 1);           // etwas heller innen
        line.lineBetween(x1, y1, x2, y2);
        
        this.channels.push(line);
      }

      update() {
        // Kein ständiges Regnen mehr!
        // Wasser fließt nur, wenn wir später Kanäle haben
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: 1100,
      height: 680,
      parent: 'game-container',
      backgroundColor: '#0a2a4a',
      scene: MainScene
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
