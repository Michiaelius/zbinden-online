<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Schritt 1</title>
  <style>
    body { 
      margin:0; padding:20px 0; background:#0a2a4a; 
      display:flex; flex-direction:column; align-items:center; 
      min-height:100vh; font-family: Arial, sans-serif;
    }
    .header {
      width: 1320px;
      background: linear-gradient(#1e3a8a, #3b82f6);
      padding: 20px 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      margin-bottom: 15px;
      text-align: center;
    }
    canvas { 
      border: 25px solid #1e40af; 
      border-radius: 25px; 
      box-shadow: 0 25px 90px rgba(0,0,0,0.95); 
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>

  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];
    let clouds = [];

    function spawnCloud() {
      const isFar = Math.random() > 0.6;
      clouds.push({
        x: Math.random() > 0.5 ? -250 : 1570,
        y: isFar ? 85 + Math.random() * 55 : 115 + Math.random() * 70,
        size: isFar ? 0.38 + Math.random() * 0.32 : 0.52 + Math.random() * 0.4,
        speed: isFar ? 0.03 + Math.random() * 0.04 : 0.045 + Math.random() * 0.055,
        direction: Math.random() > 0.5 ? 1 : -1,
        opacity: isFar ? 0.68 : 0.9,
        pause: 0,
        life: 1.0,
        dissolving: false
      });
    }

    // Anfangswolken
    for (let i = 0; i < 3; i++) spawnCloud();

    const sandCanvas = document.createElement('canvas');
    sandCanvas.width = 1320;
    sandCanvas.height = 350;
    const sandCtx = sandCanvas.getContext('2d');

    function createFixedSand() {
      sandCtx.fillStyle = '#e2c18a';
      sandCtx.fillRect(0, 0, 1320, 350);
      sandCtx.fillStyle = '#c99a5f';
      for (let i = 0; i < 5200; i++) {
        sandCtx.beginPath();
        sandCtx.arc(Math.random()*1320, Math.random()*350, Math.random()*5 + 1.4, 0, Math.PI*2);
        sandCtx.fill();
      }
    }
    createFixedSand();

    function spawnBird() {
      const count = Math.random() < 0.6 ? 1 : 2; // mal 1, mal 2 zusammen
      const dir = Math.random() > 0.5 ? 1 : -1;
      
      for (let i = 0; i < count; i++) {
        const scale = 0.32 + Math.random() * 0.38;
        birds.push({
          x: dir > 0 ? -80 - i*35 : 1400 + i*35,
          y: 115 + Math.random() * 155,
          baseY: 115 + Math.random() * 155,
          speed: 1.0 + Math.random() * 0.8,
          direction: dir,
          flap: Math.random() * 10,
          scale: scale,
          wave: Math.random() * Math.PI * 2,
          roll: 0,
          rollSpeed: 0,
          lastTurn: 0
        });
      }
    }

    for (let i = 0; i < 2; i++) spawnBird();

    function drawStaticBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, 460);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 460);

      ctx.fillStyle = '#fcd34d';
      ctx.beginPath(); ctx.arc(1080, 170, 82, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(1080, 170, 63, 0, Math.PI*2); ctx.fill();

      ctx.drawImage(sandCanvas, 0, 410);
    }

    function drawCloud(cloud) {
      ctx.globalAlpha = cloud.opacity * cloud.life;
      const s = cloud.size;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.ellipse(cloud.x, cloud.y, 115*s, 42*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 78*s, cloud.y - 16*s, 68*s, 36*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cloud.x + 38*s, cloud.y - 22*s, 48*s, 31*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    function drawBird(bird) {
      const flap = Math.sin(bird.flap) * 7;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      if (bird.roll !== 0) ctx.rotate(bird.roll);
      if (bird.direction < 0) ctx.scale(-1, 1);
      ctx.scale(bird.scale, bird.scale);

      ctx.strokeStyle = '#1e2937';
      ctx.fillStyle = '#1e2937';
      ctx.lineWidth = 3.2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(14, -19 + flap, 35, -10);
      ctx.quadraticCurveTo(26, -5, 11, 4);
      ctx.fill(); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(19, 5, 13, 8, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(30, 1, 6.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(35, 0); ctx.lineTo(43, 2); ctx.lineTo(35, 4); ctx.fill();

      ctx.restore();
    }

    function drawMovingElements() {
      clouds.forEach(cloud => drawCloud(cloud));
      birds.forEach(bird => drawBird(bird));
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 460);
      drawStaticBackground();
      drawMovingElements();

      // Wolken
      for (let i = clouds.length - 1; i >= 0; i--) {
        const c = clouds[i];
        if (c.pause > 0) c.pause--; else c.x += c.speed * c.direction;

        if (Math.random() < 0.004) c.pause = 100 + Math.random()*200;
        if (!c.dissolving && Math.random() < 0.002) c.dissolving = true;
        if (c.dissolving) c.life -= 0.008;

        if (c.x < -500 || c.x > 1800 || c.life <= 0) clouds.splice(i, 1);
      }

      // Gelegentlich neue Wolke von der Seite
      if (clouds.length < 4 && Math.random() < 0.008) spawnCloud();

      // Vögel – mehr Abwechslung
      for (let i = birds.length - 1; i >= 0; i--) {
        const b = birds[i];
        b.wave += 0.0058;
        b.x += b.speed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 24;
        b.flap += 0.22;

        // Mehr Rollen
        if (Math.random() < 0.012) b.rollSpeed = (Math.random() - 0.5) * 0.28;
        b.roll += b.rollSpeed;
        if (Math.abs(b.roll) > 0.4) b.rollSpeed *= -0.7;

        // Gelegentlicher Richtungswechsel
        if (Date.now() - b.lastTurn > 8000 && Math.random() < 0.003) {
          b.direction *= -1;
          b.lastTurn = Date.now();
        }

        if (b.x < -150 || b.x > 1470) birds.splice(i, 1);
      }

      // Variabler Vogelnachschub
      if (birds.length < 4 && Math.random() < 0.009) spawnBird();

      requestAnimationFrame(animate);
    }

    drawStaticBackground();
    animate();
  </script>
</body>
</html>
