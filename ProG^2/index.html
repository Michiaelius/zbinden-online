<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wasser-Logik - Basis B</title>
  <style>
    body { margin:0; padding:20px 0; background:#0a2a4a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family: Arial, sans-serif; }
    .header { width: 1320px; background: linear-gradient(#1e3a8a, #3b82f6); padding: 20px 0; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 15px; text-align: center; }
    canvas { border: 25px solid #1e40af; border-radius: 25px; box-shadow: 0 25px 90px rgba(0,0,0,0.95); }
  </style>
</head>
<body>
  <div class="header">
    <h1 style="margin:0; color:white; font-size:58px;">💧 Wasser-Logik</h1>
    <p style="margin:8px 0 0 0; color:#bae6fd; font-size:28px;">Level 1 — Graben & Wasser lenken</p>
  </div>
  <canvas id="game" width="1320" height="760"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let birds = [];

    function spawnBird() {
      const dir = Math.random() > 0.5 ? 1 : -1;
      birds.push({
        x: dir > 0 ? -100 : 1420,
        y: 120 + Math.random() * 100,
        baseY: 120 + Math.random() * 100,
        speed: 1.2 + Math.random() * 0.6,
        currentSpeed: 1.2,
        targetSpeed: 1.2,
        direction: dir,
        flap: Math.random() * 10,
        scale: 0.45,
        wave: Math.random() * Math.PI * 2,
        roll: 0,
        isTurning: false,
        turnPhase: 0,
        lastTurn: Date.now()
      });
    }

    for (let i = 0; i < 4; i++) spawnBird();

    function drawStaticBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, 250);
      sky.addColorStop(0, '#60a5fa');
      sky.addColorStop(1, '#bae6fd');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1320, 250);

      const sunX = 1050; const sunY = 135;
      ctx.shadowColor = '#fef08c'; ctx.shadowBlur = 50;
      ctx.fillStyle = '#fef08c';
      ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI*2); ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e2c18a';
      ctx.fillRect(0, 250, 1320, 510);
    }

    function drawBird(b) {
      const flap = Math.sin(b.flap) * 10;
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b.roll) ctx.rotate(b.roll * 0.2);
      if (b.direction < 0) ctx.scale(-1, 1);
      ctx.scale(b.scale, b.scale);

      ctx.fillStyle = '#1e2937';
      ctx.strokeStyle = '#1e2937';
      ctx.lineWidth = 2.5;

      // Schwanz, Flügel, Körper, Kopf, Schnabel (einfach)
      ctx.beginPath(); ctx.moveTo(8,8); ctx.lineTo(1,5); ctx.lineTo(2,12); ctx.fill();
      ctx.beginPath(); ctx.moveTo(23,13); ctx.quadraticCurveTo(12, -20 + flap*4, 12, -2); ctx.quadraticCurveTo(21,4,14,13); ctx.fill();
      ctx.beginPath(); ctx.ellipse(19,8,10,7,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(29,4,6,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(34,3); ctx.lineTo(45,4); ctx.lineTo(34,5.5); ctx.fill();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, 1320, 760);
      drawStaticBackground();

      birds.forEach(b => drawBird(b));

      birds.forEach(b => {
        b.currentSpeed += (b.targetSpeed - b.currentSpeed) * 0.04;
        b.wave += 0.0016;
        b.x += b.currentSpeed * b.direction;
        b.y = b.baseY + Math.sin(b.wave) * 14;
        b.flap += 0.06;

        // === Sehr einfacher Richtungswechsel ===
        if (!b.isTurning && Date.now() - b.lastTurn > 2500 && Math.random() < 0.008) {
          b.isTurning = true;
          b.turnPhase = 0;
          b.targetSpeed = b.speed * 0.15;
        }

        if (b.isTurning) {
          b.turnPhase++;

          if (b.turnPhase < 40) b.targetSpeed = b.speed * 0.15;
          else if (b.turnPhase < 90) b.targetSpeed = 0.05;
          else if (b.turnPhase < 100) {
            b.direction *= -1;     // <--- Hier wird gedreht
            b.targetSpeed = b.speed * 0.7;
          } 
          else if (b.turnPhase > 140) {
            b.targetSpeed = b.speed;
            b.isTurning = false;
            b.lastTurn = Date.now();
          }
        }
      });

      // Entfernen von Vögeln außerhalb
      for (let i = birds.length - 1; i >= 0; i--) {
        if (birds[i].x < -200 || birds[i].x > 1520) birds.splice(i, 1);
      }

      // Neue Vögel spawnen
      if (birds.length < 5 && Math.random() < 0.02) spawnBird();

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
