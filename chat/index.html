<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Chat - zbinden.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; }
        .chat-container { height: calc(100vh - 80px); }
        .message-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
        }
        .user-bubble { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .ai-bubble { background: #1f2937; border-bottom-left-radius: 4px; }

        /* Intro Animation */
        .intro-logo {
            animation: logoPop 1.2s ease forwards;
        }
        @keyframes logoPop {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .typing {
            display: inline-flex;
            align-items: center;
        }
        .typing::after {
            content: '•••';
            animation: typingDots 1.4s infinite;
        }
    </style>
</head>
<body class="text-slate-200">
    <div class="flex h-screen">

        <!-- Sidebar (gleich wie vorher) -->
        <div class="w-72 sidebar flex flex-col border-r border-slate-800">
            <div class="p-5 border-b border-slate-800">
                <h1 class="text-2xl font-bold flex items-center gap-2 intro-logo">
                    <i class="fas fa-brain text-blue-500"></i> zbinden KI
                </h1>
            </div>
            <div class="p-4">
                <button onclick="newChat()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> Neuer Chat
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-3" id="chat-history"></div>
        </div>

        <!-- Haupt-Chat -->
        <div class="flex-1 flex flex-col">
            <div class="h-16 border-b border-slate-800 flex items-center px-6">
                <h2 id="chat-title" class="font-semibold text-lg">Neuer Chat</h2>
            </div>

            <!-- Chat Messages -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-8 chat-container">
                <!-- Wird per JS gefüllt -->
            </div>

            <!-- Input -->
            <div class="p-6 border-t border-slate-800">
                <div class="max-w-4xl mx-auto relative">
                    <textarea id="user-input" rows="1"
                        class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-6 py-5 pr-24 resize-none focus:outline-none focus:border-blue-500"
                        placeholder="Nachricht an die KI..."></textarea>
                    <button onclick="sendMessage()" 
                        class="absolute right-3 bottom-3 bg-blue-600 hover:bg-blue-700 w-10 h-10 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Willkommens-Animation beim Laden
        function showWelcome() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = `
                <div class="max-w-2xl mx-auto text-center pt-20">
                    <div class="intro-logo inline-flex items-center gap-4 mb-8">
                        <i class="fas fa-brain text-6xl text-blue-500"></i>
                        <div>
                            <h1 class="text-5xl font-bold">zbinden KI</h1>
                            <p class="text-blue-400 text-xl">Dein persönlicher Assistent</p>
                        </div>
                    </div>
                    <p class="text-slate-400 text-2xl">Hallo Michael 👋</p>
                    <p class="text-slate-500 mt-3">Wie kann ich dir heute helfen?</p>
                </div>
            `;
        }

        function addMessage(sender, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="message-bubble ${sender === 'user' ? 'user-bubble' : 'ai-bubble'}">
                    ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';

            // Simulierte KI-Antwort mit "Denkt nach"
            const thinking = document.createElement('div');
            thinking.id = 'thinking';
            thinking.className = 'flex justify-start';
            thinking.innerHTML = `
                <div class="message-bubble ai-bubble typing text-slate-400">
                    Denkt nach
                </div>
            `;
            document.getElementById('chat-messages').appendChild(thinking);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;

            setTimeout(() => {
                document.getElementById('thinking').remove();
                addMessage('ai', 'Das ist eine Demo-Antwort. Später wird hier die echte Ollama-Antwort erscheinen.');
            }, 1200);
        }

        function newChat() {
            if (confirm("Neuen Chat starten?")) {
                showWelcome();
            }
        }

        // Enter-Taste
        document.getElementById('user-input').addEventListener('keypress', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Seite starten
        window.onload = showWelcome;
    </script>
</body>
</html>
