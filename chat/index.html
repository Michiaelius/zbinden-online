<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Chat - zbinden.online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { background: #0a0a0a; }
        .chat-container { height: calc(100vh - 80px); }
        .message-bubble {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
        }
        .user-bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-bubble {
            background: #1f2937;
            border-bottom-left-radius: 4px;
        }
        .sidebar { background: #111827; }
    </style>
</head>
<body class="text-slate-200">
    <div class="flex h-screen">

        <!-- Sidebar -->
        <div class="w-72 sidebar flex flex-col border-r border-slate-800">
            <div class="p-5 border-b border-slate-800">
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fas fa-brain text-blue-500"></i> zbinden KI
                </h1>
            </div>
            
            <div class="p-4">
                <button onclick="newChat()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> Neuer Chat
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chat-history">
                <!-- Wird dynamisch gefüllt -->
            </div>

            <div class="p-4 border-t border-slate-800 text-sm text-slate-400">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center">
                        👤
                    </div>
                    <div>
                        <p class="font-medium text-white">Michael Zbinden</p>
                        <p class="text-xs">Online</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Haupt-Chat -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <div class="h-16 border-b border-slate-800 flex items-center px-6 justify-between">
                <div class="flex items-center gap-3">
                    <h2 id="chat-title" class="font-semibold text-lg">Neuer Chat</h2>
                </div>
                <div class="flex items-center gap-4 text-sm">
                    <span class="px-3 py-1 bg-slate-800 rounded-full">Llama 3.1 70B</span>
                    <button class="text-slate-400 hover:text-white">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-8 chat-container">
                <!-- Willkommen Nachricht -->
                <div class="max-w-2xl mx-auto text-center pt-12">
                    <h1 class="text-4xl font-bold mb-4">Hallo Michael 👋</h1>
                    <p class="text-slate-400 text-lg">Wie kann ich dir heute helfen?</p>
                </div>
            </div>

            <!-- Input -->
            <div class="p-6 border-t border-slate-800">
                <div class="max-w-4xl mx-auto">
                    <div class="relative">
                        <textarea id="user-input" rows="1"
                            class="w-full bg-slate-900 border border-slate-700 rounded-3xl px-6 py-5 pr-24 resize-none focus:outline-none focus:border-blue-500"
                            placeholder="Nachricht an die KI..."></textarea>
                        <button onclick="sendMessage()"
                            class="absolute right-3 bottom-3 bg-blue-600 hover:bg-blue-700 w-10 h-10 rounded-2xl flex items-center justify-center">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <p class="text-center text-xs text-slate-500 mt-3">
                        Dies ist eine Demo • Antworten können fehlerhaft sein
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let messages = [];

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            // User Message hinzufügen
            addMessage('user', text);
            input.value = '';

            // Simulierte KI-Antwort (später mit echtem Backend ersetzen)
            setTimeout(() => {
                addMessage('ai', 'Das ist eine simulierte Antwort. Später wird hier die echte Antwort von Ollama kommen.');
            }, 800);
        }

        function addMessage(sender, text) {
            messages.push({ sender, text });
            
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="message-bubble ${sender === 'user' ? 'user-bubble' : 'ai-bubble'}">
                    ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function newChat() {
            if (confirm("Neuen Chat starten?")) {
                messages = [];
                document.getElementById('chat-messages').innerHTML = `
                    <div class="max-w-2xl mx-auto text-center pt-12">
                        <h1 class="text-4xl font-bold mb-4">Hallo Michael 👋</h1>
                        <p class="text-slate-400 text-lg">Wie kann ich dir heute helfen?</p>
                    </div>
                `;
            }
        }

        // Enter-Taste senden
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
